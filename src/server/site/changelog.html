<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:changelog-->
  <style>
    .log {
      animation: rise .55s ease .05s both;
      padding-bottom: 1rem;
    }
    .log details {
      border-top: 1px solid var(--line);
    }
    .log details:last-of-type { border-bottom: 1px solid var(--line); }
    .log summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.15rem 0;
      cursor: pointer;
      list-style: none;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -.015em;
    }
    .log summary::-webkit-details-marker { display: none; }
    .log summary:hover { color: var(--chrome); }
    .log summary .acc-meta {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex: none;
    }
    .log summary .acc-count {
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--chrome-dim);
    }
    .log summary::after {
      content: "+";
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--chrome-dim);
    }
    .log details[open] > summary::after { content: "−"; }

    .month-body { padding: 0 0 1.25rem; display: grid; gap: 1.35rem; }
    .entry-title {
      margin: 0 0 .65rem;
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .entry-date {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--chrome-dim);
      margin: 0 0 .35rem;
    }
    .what ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: .55rem;
    }
    .what li {
      display: grid;
      grid-template-columns: 4.6rem 1fr;
      gap: .85rem;
      align-items: start;
      color: var(--muted);
      font-size: .925rem;
      line-height: 1.55;
      max-width: 72ch;
    }
    .tag {
      font-family: var(--mono);
      font-size: .6rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: center;
      padding: .3rem 0;
      border: 1px solid var(--line2);
      border-radius: 3px;
      color: var(--chrome-dim);
      margin-top: .1rem;
    }
    .tag.added { color: #0b0c0e; background: var(--accent); border-color: var(--accent); }
    .tag.changed { color: var(--chrome); }

    .subscribe {
      margin: clamp(2rem, 5vh, 3rem) 0 3rem;
      border-top: 1px solid var(--line);
      padding-top: 1.75rem;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.65;
      max-width: 62ch;
    }
    .subscribe a { color: var(--chrome); text-decoration: underline; }

    @media (max-width: 820px) {
      .what li { grid-template-columns: 4.6rem 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
<!--NAV:-->

    <section class="page-hero">
      <p class="label">Changelog</p>
      <h1>What's new</h1>
      <p>Panel, Discord bot, and site updates by month.</p>
    </section>

    <div class="log" data-acc>
<!--ENTRIES-->
    </div>

    <p class="subscribe">
      Found a bug or want something added? <a href="/contact">Tell us</a>.
    </p>

<!--FOOTER-->
  </div>
</body>
</html>
