<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:changelog-->
  <style>
    .cl-hero {
      padding: clamp(2.5rem, 6vh, 3.75rem) 0 1.75rem;
      animation: rise .5s ease both;
      border-bottom: 1px solid var(--line);
      margin-bottom: 2rem;
    }
    .cl-hero .label {
      margin-bottom: .85rem;
      font-size: .75rem;
      color: var(--accent);
      letter-spacing: .14em;
    }
    .cl-hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.1;
    }
    .cl-hero > p:not(.label) {
      margin: .85rem 0 0;
      color: var(--muted);
      font-size: .95rem;
      max-width: 48ch;
      line-height: 1.6;
    }

    .timeline {
      display: grid;
      gap: 2.75rem;
      padding-bottom: 1rem;
      animation: rise .55s ease .05s both;
    }
    .month {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 1.75rem;
      align-items: start;
    }
    .month-label {
      position: sticky;
      top: 1.5rem;
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--chrome-dim);
      padding-top: .35rem;
    }
    .month-label span {
      display: block;
      margin-top: .35rem;
      color: var(--faint);
      letter-spacing: .08em;
      font-size: .65rem;
    }

    .month-entries {
      display: grid;
      gap: 0;
      border-left: 1px solid var(--line);
      padding-left: 1.5rem;
    }
    .entry {
      position: relative;
      padding: 0 0 1.85rem;
    }
    .entry:last-child { padding-bottom: 0; }
    .entry::before {
      content: "";
      position: absolute;
      left: -1.7rem;
      top: .45rem;
      width: .45rem;
      height: .45rem;
      border-radius: 1px;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--bg);
    }
    .entry-date {
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 .4rem;
    }
    .entry-title {
      margin: 0 0 .75rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -.015em;
    }
    .what ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: .55rem;
    }
    .what li {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: .75rem;
      align-items: start;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.55;
      max-width: 68ch;
    }
    .tag {
      font-family: var(--mono);
      font-size: .58rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: center;
      padding: .28rem 0;
      border: 1px solid var(--line2);
      border-radius: 3px;
      color: var(--chrome-dim);
      margin-top: .08rem;
    }
    .tag.added { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    .tag.changed { color: var(--accent); border-color: rgba(126,200,245, .35); }
    .tag.fixed { color: var(--ok); border-color: rgba(126, 207, 154, .35); }

    .subscribe {
      margin: 2.5rem 0 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .9rem;
    }
    .subscribe a { color: var(--accent); text-decoration: underline; }

    @media (max-width: 820px) {
      .month { grid-template-columns: 1fr; gap: .75rem; }
      .month-label { position: static; }
      .month-entries { padding-left: 1.15rem; }
      .entry::before { left: -1.35rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
<!--NAV:-->

    <header class="cl-hero">
      <p class="label">Release notes</p>
      <h1>Changelog</h1>
      <p>Shipped updates to the panel, Discord bot, and site — newest first.</p>
    </header>

    <div class="timeline" data-reveal>
<!--ENTRIES-->
    </div>

    <p class="subscribe">
      Found a bug or want something added? <a href="/contact">Tell us</a>.
    </p>

<!--FOOTER-->
  </div>
</body>
</html>
