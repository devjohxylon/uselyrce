<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Get started — Usely</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("/fonts/SpaceGrotesk-Medium.ttf") format("truetype");
      font-weight: 400 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("/fonts/SpaceGrotesk-Bold.ttf") format("truetype");
      font-weight: 600 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("/fonts/JetBrainsMono-Regular.ttf") format("truetype");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root {
      --bg: #070809; --bg2: #101216; --bg3: #161b22;
      --line: rgba(126,200,245,.1); --line2: rgba(232,236,241,.14);
      --text: #e8ecf1; --muted: #9aa3ad; --faint: #5c6570;
      --chrome: #d5dbe3; --chrome-dim: #8b939e; --accent: #7ec8f5;
      --accent-ink: #071018;
      --ok: #7ecf9a; --bad: #e58f8f; --radius: 4px;
      --font: "Space Grotesk", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body {
      margin: 0; font-family: var(--font); color: var(--text);
      background: radial-gradient(900px 500px at 50% -15%, rgba(126,200,245,.12), transparent 55%), var(--bg);
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
    }
    a { color: inherit; text-decoration: none; }
    .card {
      width: min(30rem, 100%); border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--bg2); padding: 2rem 1.75rem; display: grid; gap: 1.1rem;
    }
    .brand { display: flex; align-items: center; gap: .65rem; font-weight: 700; letter-spacing: .14em; font-size: .85rem; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; }
    p.sub { margin: -0.5rem 0 0; color: var(--muted); font-size: .92rem; line-height: 1.5; }
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .plan {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg3);
      padding: .8rem .7rem; cursor: pointer; display: grid; gap: .25rem; text-align: center;
    }
    .plan input { display: none; }
    .plan .nm { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--chrome-dim); }
    .plan .pr { font-weight: 700; font-size: 1.15rem; }
    .plan .sv { color: var(--faint); font-size: .72rem; }
    .plan.sel { border-color: var(--chrome); background: var(--bg-elev, #181b22); }
    .plan.sel .nm { color: var(--chrome); }
    label { font-size: .82rem; color: var(--muted); display: grid; gap: .35rem; }
    input[type=email] {
      width: 100%; font: inherit; color: var(--text); background: var(--bg3);
      border: 1px solid var(--line2); border-radius: var(--radius); padding: .75rem .85rem; outline: none;
    }
    input[type=email]:focus { border-color: var(--chrome-dim); }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: var(--radius);
      background: var(--accent); color: var(--accent-ink); padding: .85rem 1rem;
    }
    button:hover { background: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    .err { color: var(--bad); font-size: .85rem; display: none; }
    .done { display: none; gap: .8rem; }
    .done h2 { margin: 0; font-size: 1.2rem; }
    .done p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.55; }
    .done a.setup { color: var(--chrome); text-decoration: underline; word-break: break-all; }
    .foot { color: var(--faint); font-size: .8rem; text-align: center; }
    .foot a { color: var(--muted); }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="card">
    <a class="brand" href="https://www.usely.dev/"><img src="/logo.png" width="28" height="28" alt="" />USELY</a>
    <div id="form" style="display:grid;gap:1.1rem">
      <h1>Choose your plan</h1>
      <p class="sub">Pick a plan and enter your email. After checkout we’ll email you a setup link.</p>
      <div class="plans" id="plans">
        <label class="plan" data-plan="basic"><input type="radio" name="plan" value="basic"><span class="nm">Basic</span><span class="pr">$20</span><span class="sv">1 server</span></label>
        <label class="plan sel" data-plan="pro"><input type="radio" name="plan" value="pro" checked><span class="nm">Pro</span><span class="pr">$49</span><span class="sv">2 servers</span></label>
        <label class="plan" data-plan="network"><input type="radio" name="plan" value="network"><span class="nm">Network</span><span class="pr">$99</span><span class="sv">2+ servers</span></label>
      </div>
      <label>Email
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <div class="err" id="err"></div>
      <button id="go">Continue to checkout</button>
    </div>
    <div class="done" id="done">
      <h2>Check your email</h2>
      <p id="doneMsg">We sent a setup link to your inbox. Open it to pick your panel address and password.</p>
      <p id="mockLink" style="display:none">Local mock mode — no payment. <a class="setup" id="mockHref" href="#">Open your setup link</a></p>
      <label id="resendWrap" style="display:none;margin-top:.5rem">Email for setup link
        <input id="resendEmail" type="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <button type="button" id="resendSetup" style="display:none;background:transparent;border:1px solid var(--line2);color:var(--text)">Resend setup email</button>
      <p id="resendMsg" class="err" style="display:none"></p>
    </div>
    <div class="foot">Already set up? <a href="/admin">Sign in to your panel</a></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const preset = params.get("plan");
    if (["basic","pro","network"].includes(preset)) selectPlan(preset);
    document.getElementById("plans").addEventListener("click", (e) => {
      const el = e.target.closest(".plan");
      if (el) selectPlan(el.dataset.plan);
    });
    function selectPlan(plan) {
      document.querySelectorAll(".plan").forEach((p) => {
        const on = p.dataset.plan === plan;
        p.classList.toggle("sel", on);
        p.querySelector("input").checked = on;
      });
    }
    function track(name, data) {
      try { window.va?.("event", { name, ...(data || {}) }); } catch {}
    }
    track("signup_view");
    document.getElementById("go").addEventListener("click", async () => {
      const btn = document.getElementById("go");
      const err = document.getElementById("err");
      err.style.display = "none";
      const email = document.getElementById("email").value.trim();
      const plan = document.querySelector(".plan.sel").dataset.plan;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        err.textContent = "Enter a valid email address.";
        err.style.display = "block";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Working…";
      track("signup_checkout_start", { plan });
      try {
        const r = await fetch("/api/signup/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, plan }),
        }).then((r) => r.json());
        if (r.url) { location.href = r.url; return; }
        if (!r.ok) throw new Error(r.error || "Signup failed");
        track("signup_mock_complete", { plan });
        document.getElementById("form").style.display = "none";
        const done = document.getElementById("done");
        done.style.display = "grid";
        document.getElementById("resendWrap").style.display = "grid";
        document.getElementById("resendSetup").style.display = "block";
        document.getElementById("resendEmail").value = email;
        if (r.mock && r.setupUrl) {
          document.getElementById("mockLink").style.display = "block";
          document.getElementById("mockHref").href = r.setupUrl;
          document.getElementById("doneMsg").textContent =
            "Local mock — checkout was skipped. Open the setup link below.";
        }
      } catch (e) {
        err.textContent = e.message;
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Continue to checkout";
      }
    });
    document.getElementById("resendSetup")?.addEventListener("click", async () => {
      const msg = document.getElementById("resendMsg");
      const btn = document.getElementById("resendSetup");
      const email = document.getElementById("resendEmail")?.value?.trim();
      msg.style.display = "none";
      msg.style.color = "";
      if (!email) {
        msg.textContent = "Enter the email you used at checkout.";
        msg.style.display = "block";
        return;
      }
      btn.disabled = true;
      try {
        const r = await fetch("/admin/auth/resend-setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        }).then((x) => x.json());
        if (!r.ok) throw new Error(r.error || "Failed");
        track("signup_resend_setup");
        msg.textContent = "If that checkout finished, we sent a new setup link.";
        msg.style.color = "var(--ok)";
        msg.style.display = "block";
      } catch (e) {
        msg.textContent = e.message || "Could not resend";
        msg.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
