<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:faq-->
  <style>
    .faq-group { animation: rise .55s ease .05s both; }
    .faq-group + .faq-group { margin-top: clamp(2.5rem, 6vh, 3.5rem); }
    .faq-group > .label { margin-bottom: 1rem; }

    details {
      border-top: 1px solid var(--line);
    }
    details:last-of-type { border-bottom: 1px solid var(--line); }
    summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.15rem 0;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -.01em;
      list-style: none;
      transition: color .15s ease;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { color: var(--chrome); }
    summary::after {
      content: "+";
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--chrome-dim);
      flex: none;
      transition: transform .2s ease;
    }
    details[open] > summary::after { content: "−"; }
    details p {
      margin: 0;
      padding: 0 0 1.35rem;
      color: var(--muted);
      font-size: .975rem;
      line-height: 1.7;
      max-width: 68ch;
    }
    details a { color: var(--chrome); text-decoration: underline; }

    .still-stuck {
      margin: clamp(2.5rem, 6vh, 3.5rem) 0 3rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg2);
      padding: 1.5rem 1.5rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .still-stuck h2 { margin: 0 0 .3rem; font-size: 1rem; font-weight: 600; }
    .still-stuck p { margin: 0; color: var(--muted); font-size: .95rem; }
  </style>
</head>
<body>
  <div class="wrap">
<!--NAV:faq-->

    <section class="page-hero">
      <p class="label">Support</p>
      <h1>Questions</h1>
      <p>What Usely does, how to connect a server, and how billing and staff access work.</p>
    </section>

    <div data-acc>
<!--FAQ-->
    </div>

    <div class="still-stuck">
      <div>
        <h2>Still have a question?</h2>
        <p>Send it over and we'll get back to you.</p>
      </div>
      <a class="btn btn-primary" href="/contact">Contact us</a>
    </div>

<!--FOOTER-->
  </div>
</body>
</html>
