<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:faq-->
  <style>
    .faq-hero {
      padding: clamp(2.5rem, 6vh, 3.75rem) 0 1.75rem;
      animation: rise .5s ease both;
      border-bottom: 1px solid var(--line);
      margin-bottom: 2rem;
    }
    .faq-hero .label {
      margin-bottom: .85rem;
      font-size: .75rem;
      color: var(--accent);
      letter-spacing: .14em;
    }
    .faq-hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.1;
    }
    .faq-hero > p:not(.label) {
      margin: .85rem 0 0;
      color: var(--muted);
      font-size: .95rem;
      max-width: 48ch;
      line-height: 1.6;
    }

    .timeline {
      display: grid;
      gap: 2.75rem;
      padding-bottom: 1rem;
      animation: rise .55s ease .05s both;
    }
    .topic {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 1.75rem;
      align-items: start;
      scroll-margin-top: 1.5rem;
    }
    .topic-label {
      position: sticky;
      top: 1.5rem;
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--chrome-dim);
      padding-top: .35rem;
    }
    .topic-label span {
      display: block;
      margin-top: .35rem;
      color: var(--faint);
      letter-spacing: .08em;
      font-size: .65rem;
    }
    .topic-label a {
      color: inherit;
      text-decoration: none;
    }
    .topic-label a:hover { color: var(--accent); }

    .topic-entries {
      display: grid;
      gap: 0;
      border-left: 1px solid var(--line);
      padding-left: 1.5rem;
    }
    .entry {
      position: relative;
      padding: 0 0 1.85rem;
    }
    .entry:last-child { padding-bottom: 0; }
    .entry::before {
      content: "";
      position: absolute;
      left: -1.7rem;
      top: .45rem;
      width: .45rem;
      height: .45rem;
      border-radius: 1px;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--bg);
    }
    .entry-q {
      margin: 0 0 .55rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -.015em;
      line-height: 1.35;
      max-width: 48ch;
    }
    .entry-a {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.55;
      max-width: 68ch;
    }
    .entry-a a { color: var(--accent); text-decoration: underline; }
    .entry-a code {
      font-family: var(--mono);
      font-size: .82em;
      color: var(--text);
    }

    .subscribe {
      margin: 2.5rem 0 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .9rem;
    }
    .subscribe a { color: var(--accent); text-decoration: underline; }

    @media (max-width: 820px) {
      .topic { grid-template-columns: 1fr; gap: .75rem; }
      .topic-label { position: static; }
      .topic-entries { padding-left: 1.15rem; }
      .entry::before { left: -1.35rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
<!--NAV:faq-->

    <header class="faq-hero">
      <p class="label">Help</p>
      <h1>FAQ</h1>
      <p>Setup, the panel, Discord, staff access, and billing — short answers.</p>
    </header>

    <div class="timeline" data-reveal>
<!--FAQ-->
    </div>

    <p class="subscribe">
      Still stuck? <a href="/contact">Contact us</a> with your panel address.
    </p>

<!--FOOTER-->
  </div>
</body>
</html>
