name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check marketing site
        run: curl -fsS -o /dev/null -w "%{http_code}\n" https://www.usely.dev/ | grep -E '^(200|301|308)$'

      - name: Check app health + Discord
        run: |
          body=$(curl -fsS https://app.usely.dev/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"discordReady":true'

      - name: Check status API
        run: |
          body=$(curl -fsS https://app.usely.dev/api/status)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"discord"'

      - name: Alert Discord on failure
        if: failure() && env.OPS_ALERT_WEBHOOK_URL != ''
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST "$OPS_ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"content":"@here Usely uptime check failed — see GitHub Actions → Uptime."}'
